# Android re-owns the sensor registry on every Android boot. hexagonrpcd
# runs as the fastrpc user/group and must be able to write it, so repair
# group ownership before each daemon start. The '+' prefix runs this as
# root, bypassing the service's User= restriction.
[Service]
ExecStartPre=+/bin/sh -c "chgrp -R fastrpc /mnt/vendor/persist/sensors/registry && chmod -R g+rw /mnt/vendor/persist/sensors/registry"
